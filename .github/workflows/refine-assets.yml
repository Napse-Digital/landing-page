name: Refine Napse brand assets

on:
  push:
    branches: [main]
    paths:
      - "tools/refine-assets.py"
      - ".github/workflows/refine-assets.yml"

permissions:
  contents: write

jobs:
  process-transparent-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout landing page
        uses: actions/checkout@v4
        with:
          path: landing-page
      - name: Checkout original brand masters
        uses: actions/checkout@v4
        with:
          repository: Napse-Digital/napse-foundations
          ref: main
          path: napse-foundations
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image processing dependencies
        run: python -m pip install --upgrade pip pillow "rembg[cpu]"
      - name: Extract and preserve transparent artwork
        working-directory: landing-page
        run: python tools/refine-assets.py
      - name: Commit transparent web assets
        working-directory: landing-page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-character-cutout.webp assets/brand-lockup-clean.webp
          git commit -m "Refine transparent Napse character and logo assets"
          git push
