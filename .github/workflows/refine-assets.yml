name: Refine Napse character asset

on:
  push:
    branches: [main]
    paths:
      - "tools/refine-assets.py"
      - ".github/workflows/refine-assets.yml"

permissions:
  contents: write

jobs:
  process-character:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout landing page
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image processing dependencies
        run: python -m pip install --upgrade pip pillow "rembg[cpu]"
      - name: Extract character background
        run: python tools/refine-assets.py
      - name: Commit transparent character
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-character-cutout.webp
          git commit -m "Regenerate transparent character cut-out"
          git pull --rebase origin main
          git push
