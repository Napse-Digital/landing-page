name: Validate landing

on:
  push:
    branches:
      - main
      - 'redesign/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate assets, anchors, brand tokens, motion and N-centered architecture
        run: python tools/validate-site.py
      - name: Check JavaScript syntax
        run: node --check script.js
